[project]
name = "breakthrough-engine"
version = "0.1.0"
description = "Turns biomedical research and ideas into scored product opportunities and build plans."
requires-python = ">=3.10"
dependencies = ["anthropic>=1.15"]

[project.scripts]
bte = "breakthrough_engine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["breakthrough_engine*"]
